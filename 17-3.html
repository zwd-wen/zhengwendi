<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>17-3 商品列表</title>
    <!--
    姓名：郑雯迪
    日期：2026-11-02
    功能名称：商品列表页，fetch 从 dummyjson.com 获取商品数据并展示，点击进入详情
    -->
    <style>
        :root {
            --ink: #17212b;
            --muted: #65727d;
            --paper: #f5f1e8;
            --card: #fffdf8;
            --line: #dcd5c8;
            --coral: #d95d46;
            --blue: #245b72;
            --yellow: #f2c05c;
            --green: #2d6a4f;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            background: var(--paper);
            color: var(--ink);
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            line-height: 1.6;
        }
        .zwd_container { max-width: 1180px; margin: 0 auto; padding: 40px 20px 60px; }
        .zwd_home {
            display: inline-block; margin-bottom: 24px;
            color: var(--blue); text-decoration: none; font-weight: 600; font-size: 14px;
        }
        .zwd_home:hover { text-decoration: underline; }

        /* Header */
        .zwd_header {
            text-align: center; margin-bottom: 36px;
            padding-bottom: 24px; border-bottom: 2px dashed var(--line);
        }
        .zwd_header h1 {
            font-family: Georgia, "Songti SC", serif;
            font-size: clamp(28px, 4vw, 42px); margin-bottom: 8px;
        }
        .zwd_header p { color: var(--muted); font-size: 14px; }
        .zwd_header .zwd_name {
            display: inline-block; margin-top: 10px; padding: 4px 14px;
            background: var(--blue); color: #fff; font-size: 12px; letter-spacing: 2px;
        }

        /* Loading */
        .zwd_loading {
            text-align: center; padding: 60px 20px; color: var(--muted);
        }
        .zwd_spinner {
            width: 40px; height: 40px; margin: 0 auto 16px;
            border: 3px solid var(--line); border-top-color: var(--coral);
            border-radius: 50%; animation: zwd_spin 1s linear infinite;
        }
        @keyframes zwd_spin { to { transform: rotate(360deg); } }

        /* Error */
        .zwd_error {
            text-align: center; padding: 40px; background: #ffe3dc;
            border: 1px solid var(--coral); color: var(--coral); margin: 20px 0;
        }

        /* 筛选栏 */
        .zwd_filter {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; flex-wrap: wrap; gap: 12px;
        }
        .zwd_filter-info { color: var(--muted); font-size: 14px; }
        .zwd_filter-info strong { color: var(--coral); font-size: 16px; }

        /* 商品网格 */
        .zwd_grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 24px;
        }
        .zwd_product {
            background: var(--card); border: 1px solid var(--line);
            overflow: hidden; transition: transform .25s ease, box-shadow .25s ease;
            cursor: pointer; display: flex; flex-direction: column;
            text-decoration: none; color: inherit;
        }
        .zwd_product:hover {
            transform: translateY(-6px);
            box-shadow: 10px 10px 0 var(--yellow);
            border-color: var(--coral);
        }
        .zwd_product-img {
            width: 100%; height: 220px; background: var(--paper);
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; position: relative;
        }
        .zwd_product-img img {
            width: 100%; height: 100%; object-fit: contain;
            padding: 10px; transition: transform .3s ease;
        }
        .zwd_product:hover .zwd_product-img img { transform: scale(1.08); }
        .zwd_product-badge {
            position: absolute; top: 10px; left: 10px;
            background: var(--coral); color: #fff; font-size: 11px;
            padding: 3px 8px; border-radius: 2px; letter-spacing: 1px;
        }
        .zwd_product-body { padding: 16px 18px 18px; flex: 1; display: flex; flex-direction: column; }
        .zwd_product-title {
            font-size: 15px; font-weight: 600; margin-bottom: 6px;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
            overflow: hidden; min-height: 44px;
        }
        .zwd_product-brand { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
        .zwd_product-desc {
            font-size: 13px; color: var(--muted); margin-bottom: 12px;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .zwd_product-foot {
            margin-top: auto; display: flex; justify-content: space-between;
            align-items: flex-end;
        }
        .zwd_product-price { font-size: 22px; font-weight: 700; color: var(--coral); }
        .zwd_product-price small { font-size: 13px; color: var(--muted); text-decoration: line-through; margin-left: 6px; font-weight: 400; }
        .zwd_product-rating { font-size: 12px; color: #f2a900; text-align: right; }
        .zwd_product-rating span:last-child { color: var(--muted); margin-left: 2px; }

        .zwd_category-tag {
            display: inline-block; font-size: 11px;
            background: var(--blue); color: #fff;
            padding: 2px 8px; border-radius: 10px; margin-bottom: 8px;
            letter-spacing: 1px;
        }

        @media (max-width: 640px) {
            .zwd_product-img { height: 180px; }
            .zwd_filter { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <div class="zwd_container">
        <a class="zwd_home" href="index.html">← 返回作品集</a>

        <header class="zwd_header">
            <h1>热门商品列表</h1>
            <p>数据来源：dummyjson.com/products · 点击商品卡片进入详情</p>
            <span class="zwd_name">郑雯迪</span>
        </header>

        <div class="zwd_filter">
            <div class="zwd_filter-info">共 <strong id="zwd_total">0</strong> 件商品</div>
            <div class="zwd_filter-info" id="zwd_apiInfo">接口：<code>https://dummyjson.com/products?limit=8</code></div>
        </div>

        <div id="zwd_content">
            <!-- 加载中 -->
            <div class="zwd_loading" id="zwd_loading">
                <div class="zwd_spinner"></div>
                <div>商品数据加载中…</div>
            </div>
        </div>
    </div>

    <script>
        // 姓名：郑雯迪
        var zwd_API = 'https://dummyjson.com/products?limit=8';
        var zwd_content = document.getElementById('zwd_content');
        var zwd_total = document.getElementById('zwd_total');

        async function zwd_loadProducts() {
            try {
                var res = await fetch(zwd_API);
                if (!res.ok) throw new Error('HTTP ' + res.status);
                var data = await res.json();

                // dummyjson 返回 { products: [...], total, skip, limit }
                var list = data.products || [];
                zwd_total.textContent = data.total || list.length;

                var html = '';
                list.forEach(function(p) {
                    var discountPrice = p.price;
                    if (p.discountPercentage) {
                        discountPrice = (p.price * (1 - p.discountPercentage / 100)).toFixed(2);
                    }
                    var discountBadge = p.discountPercentage > 0
                        ? '<span class="zwd_product-badge">-' + Math.round(p.discountPercentage) + '%</span>'
                        : '';

                    html +=
                        '<a class="zwd_product" href="17-3-detail.html?id=' + p.id + '">' +
                            '<div class="zwd_product-img">' +
                                discountBadge +
                                '<img src="' + (p.thumbnail || p.images[0]) + '" alt="' + p.title + '" loading="lazy" onerror="this.src=\'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22><rect width=%22100%22 height=%22100%22 fill=%22%23eee%22/><text x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 fill=%22%23999%22 font-size=%2214%22>图片加载中</text></svg>\'">' +
                            '</div>' +
                            '<div class="zwd_product-body">' +
                                '<span class="zwd_category-tag">' + (p.category || '') + '</span>' +
                                '<div class="zwd_product-title">' + p.title + '</div>' +
                                '<div class="zwd_product-brand">品牌：' + (p.brand || '未知') + '</div>' +
                                '<div class="zwd_product-desc">' + (p.description || '') + '</div>' +
                                '<div class="zwd_product-foot">' +
                                    '<div class="zwd_product-price">¥' + discountPrice +
                                        (p.discountPercentage > 0 ? '<small>¥' + p.price + '</small>' : '') +
                                    '</div>' +
                                    '<div class="zwd_product-rating">★ ' + (p.rating || 0) + '<span>(' + p.stock + '件)</span></div>' +
                                '</div>' +
                            '</div>' +
                        '</a>';
                });

                zwd_content.innerHTML = '<div class="zwd_grid">' + html + '</div>';
            } catch (err) {
                zwd_content.innerHTML =
                    '<div class="zwd_error">❌ 加载失败：' + err.message + '<br><br>' +
                    '<small>请检查网络连接或接口是否可跨域访问</small></div>';
            }
        }

        zwd_loadProducts();
    </script>
</body>
</html>
