<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>525 郑雯迪</title>
    <style>
        h3{
            color:red;
        }
        p{
            color:blue;
        }
        /* 标签选择器，选择器名为标签 */
        #box{
            width: 500px;
            height: 500px;
            background-color: #ccc;
        }
        /* id选择器，以#开始，唯一 */
        .n1{
            color:#7A9;
        }
        /* class选择器，以.开始，可以重复使用 */
        /* 扩展样式 */
        h2{
            background-color: black;
            color: white;
        }
        .white-text{
            color:#fff;
        }
        .stu-box{
            width:300px;
            height:100px;
            background:#ffc;
            margin-top:20px;
            line-height:100px;
            text-align:center;
            font-size:20px;
        }
        .z{color:#f00;}
        .w{color:#00f;}
        .d{color:#090;}
    </style>
</head>
<body>
    <h2>层叠样式表</h2>
    <div id="box">
        <h3>CSS<span class="white-text">选择器</span></h3>
        <p><span class="z">郑</span><span class="w">雯</span><span class="d">迪</span></p>
        <p>CSS属性</p>
        
    </div>
    <!-- 扩展4：学号盒子 -->
    <div class="stu-box">525</div>
    <!--扩展： 
        1、h2黑底白字
        2、你的名字每个字不同颜色，在同一行。
        3、选择器三个字是白色。
        4、新加一个盒子，盒子里的文字是你的学号，盒子有宽高背景。
     -->
</body>
</html>
