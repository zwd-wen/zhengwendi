<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /*全局css*/
        *{
            margin: 0;
            padding: 0;
        }
        img{
            display: block;
        }
        ul,ol{list-style: none;}
        .tlist{
            display: flex;
            flex-wrap: wrap;
        }
        .tlist li{
            width: 30%;
            margin: 3px;
            flex-grow: 2;
            overflow: hidden;
            position: relative;
        }
        .tlist img{
            width: 100%;
            transition: all 0.5s ease;
        }
        .text{
            position: absolute;
            left: 0;
            bottom: 0;
            background-color: rgba(0,0,0,0,5);
            color: white;
            transition: all 0.5s ease;
            height: 33px;
            font-size: 12px;
        }
        .text h3{
            height: 33px;
            line-height: 33px;
            text-align: center;
        }
        .text p{
            height: 40px;
            padding: 5px;
            line-height: 20px;
            overflow: hidden;
            /*首行缩进*/
            text-indent: 2em;
        }
        .tlist li:nth-child(3n+1):hover img{
            transform: scale(1.7);
        }
        .tlist li:nth-child(3n+2):hover .text{
            height: 100%;
        }
        .tlist li:nth-child(3n):hover .text{
            height: 83px;
        }
    </style>
</head>
<body>
    <h2>trasition 过渡</h2>
    <ul class="tlist">
        <li>
            <img src="./img/1.jpg">
            <div class="text">
                <h3>郑雯迪的标题1</h3>
                <p>
                    下面的文字是绝对定位，p元素默认隐藏，只显示h3，当鼠标hover的时候，会有动画效果。
                </p>
            </div>
        </li>
        <li>
            <img src="./img/2.jpg">
            <div class="text">
                <h3>郑雯迪的标题2</h3>
                <p>
                    下面的文字是绝对定位，p元素默认隐藏，只显示h3，当鼠标hover的时候，会有动画效果。
                </p>
            </div>
        </li>
        <li>
            <img src="./img/3.jpg">
            <div class="text">
                <h3>郑雯迪的标题3</h3>
                <p>
                    下面的文字是绝对定位，p元素默认隐藏，只显示h3，当鼠标hover的时候，会有动画效果。
                </p>
            </div>
        </li>
    </ul>
</body>
</html>
