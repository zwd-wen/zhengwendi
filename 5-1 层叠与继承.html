<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link rel="stylesheet" href="css.css">
    <style>
        .text{
            color: voilet!important;
        }
        #box p{
            color: silver;
        }
        .box{
            color: purple;
        }
        #text{
            color: yellow;

    <h2>层叠与继承</h2>

        <p id="text" class="text">525郑雯迪</p>
        <p>CSS选择器的优先级</p>
    </div>
</body>
