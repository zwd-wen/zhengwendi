<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盒模型、框模型、box model    </title>
    <style>
        body,ul,p,h1,h2,h3,h4,h5,h6{
            margin:0;
            padding:0;
        }
        /* 尽量少用* */
        .a{
            width:500px;
            height:300px;
            border: 2px dotted #039;
            padding:70px 60px 50px 40px;/* 上右下左 */
            margin:40px auto;
            /* 上下、左右，左右为margin为auto则 */
        }
        /* 盒子的高度：内容的高度+上下边框的高度+上下padding的高度+上下margin的高度 */
        .b{
            width:500px;
            height:300px;
            border:2px dashed #039;
            margin:50px auto 40px;
             /* 上、左右、下 */
        }
        .c{
            width:500px;
            height:300px;
            border:2px solid #039;
            margin:50px auto 40px;
             /* 上、左右、下 */
        }
    </style>
</head>
<body>
    <div class="a">525郑雯迪</div>
    <div class="b">525郑雯迪</div>
    <div class="c">525郑雯迪</div>
</body>
</html>
